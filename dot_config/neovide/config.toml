# Neovide startup config. Only command-line equivalent options are valid here;
# cursor animation / particle effects / window effects are configured from Neovim
# in ~/.config/nvim/lua/config/neovide.lua.

# Render only on events instead of continuously (idle = false would redraw every frame)
idle = true

# No multigrid: disables smooth scrolling and window animations
no-multigrid = true
